# ECMP Event Catalog (SOURCE OF TRUTH — normative)
# ID: EVT-CAT-001
# Governance: per DEC-001/DEC-002; duplicate draft catalog retired 2026-07-21.
# Naming: payload fields use camelCase (API/event standard, see 21 Technical Standards).
# 2026-07-22 (Sprint-03A governance sync): EVT-002/EVT-003/EVT-005 status corrected
# Planned -> Implemented. Runtime already emits these (Sprint-02B, verified by
# tests/test_service_unit.py::test_assign_and_status_payloads_match_event_catalog
# and tests/test_lifecycle.py). Payloads unchanged (still frozen per DEC-006) —
# this is a status-field correction only, not a contract change.
version: 0.7
owner: Integration Lead
status: Approved
delivery_guarantee: at-least-once (ADR-001); all consumers MUST be idempotent
# Per-event lifecycle status vocabulary:
#   Implemented = emitted by running code; Planned = approved, not yet produced; Proposed = pending approval.
# 2026-07-24 (TASK-045): EVT-009..EVT-015 Complaint* foundation added (in-memory factory; no bus).
# 2026-07-29 (S0 / FRD-CM-001): EVT-CM-001..034 Planned for Complaint Aggregate Batch 1.
events:
  - id: EVT-001
    name: CaseCreated
    status: Implemented
    producer: ECMF
    description: Emitted when a case is registered (FR-001b)
    fr: FR-001
    api: API-001
    payload:
      caseId: string
      customerId: string
      caseType: string
      priority: string
      subject: string
      status: string
      createdAt: datetime
      createdBy: string
    consumers:
      - KPI            # initialize SLA clock / performance fact
      - Dashboard
      - Notification   # notify assignee pool / supervisor
      - Core Platform  # audit projection
    idempotency: idempotent by caseId; consumers ignore duplicates by caseId + createdAt
  - id: EVT-002
    name: CaseAssigned
    status: Implemented
    producer: ECMF
    description: Emitted when a case is assigned/reassigned (Sprint-02B). Payload FROZEN at gate G1 (DEC-006, 2026-07-21) — changes require a new freeze decision.
    fr: FR-003
    api: API-003
    payload:
      caseId: string
      assigneeId: string
      unitId: string
      assignedBy: string
      previousAssigneeId: string   # nullable
      assignedAt: datetime
    consumers:
      - Notification
      - Dashboard
      - Core Platform
    idempotency: ordered per caseId (sequence number) so latest assignment wins
  - id: EVT-003
    name: StatusChanged
    status: Implemented
    producer: ECMF
    description: Emitted on valid workflow status transition (BR-001) (Sprint-02B). Payload FROZEN at gate G1 (DEC-006, 2026-07-21) — changes require a new freeze decision.
    fr: FR-004
    api: API-004   # also emitted by API-003 alongside EVT-002 (every valid transition, DOM-ECMF-003)
    payload:
      caseId: string
      fromStatus: string
      toStatus: string
      changedBy: string
      changedAt: datetime
      reason: string   # nullable; mandatory for Administrator override transitions (BR-ECMF-03) and CLOSED->REOPENED (BR-ECMF-07)
    consumers:
      - KPI            # SLA clock / status history
      - Dashboard
      - Notification
      - Core Platform
    idempotency: ordered per caseId; consumers validate transition against last known status
  - id: EVT-004
    name: SLABreached
    status: Implemented
    producer: KPI
    description: >
      Emitted when resolution SLA threshold is breached (FR-030 / DEC-031 Fase 2).
      Mode A Aggregate fills caseId with complaintId (DEC-031 §2.3). Produced by
      scheduled sweep (OPS-CM-B1-SLA-001), drained locally via outbox (C-4).
    payload:
      caseId: string
      slaId: string
      breachedAt: datetime
      dueAt: datetime
      severity: string
    consumers:
      - Notification   # escalate to supervisor/manager (CAP-005 Deferred — in-app only C-6)
      - Dashboard
    idempotency: idempotent by caseId + slaId; emit once per breach (re-breach after reopen allowed)
  - id: EVT-005
    name: CaseClosed
    status: Implemented
    producer: ECMF
    description: Emitted when a case is closed (Sprint-02B, PENDING_REVIEW→CLOSED only; other producing transitions remain out of scope)
    payload:
      caseId: string
      resolutionCode: string
      closedBy: string
      closedAt: datetime
    consumers:
      - KPI            # finalize performance fact (lead time)
      - Dashboard
      - Notification
      - Core Platform
    idempotency: idempotent by caseId; single active closure; reopen emits EVT-007
  - id: EVT-006
    name: ConfigChanged
    status: Planned
    producer: Administration
    description: Emitted when effective configuration changes (BR-ADM-02)
    payload:
      configKey: string
      version: string
      oldValue: object
      newValue: object
      changedBy: string
      changedAt: datetime
      effectiveDate: datetime
    consumers:
      - Core Platform  # mandatory audit (BR-CP-04)
      - ECMF           # reload active workflow/SLA config
      - KPI            # reload active SLA rules
    idempotency: idempotent by configKey + version; consumers reload latest version, no partial replay
  - id: EVT-007
    name: CaseReopened
    producer: ECMF
    description: Emitted when a closed case is reopened (BR-ECMF-07); proposed addition beyond Blueprint minimal set
    status: Proposed
    payload:
      caseId: string
      reopenedBy: string
      reopenedAt: datetime
      reason: string
    consumers:
      - KPI            # restart SLA clock
      - Dashboard
      - Notification
      - Core Platform
    idempotency: idempotent by caseId + reopenedAt
  - id: EVT-008
    name: ConfigChangeRequested
    status: Proposed
    producer: Administration
    description: Emitted when a critical configuration change request is submitted for approval (BR-ADM-01, FRD-007 FR-063); proposed via ECMP_FRD_Administration_v0.1
    fr: FR-063
    payload:
      changeRequestId: string
      configKey: string
      requestedBy: string
      requestedAt: datetime
      approverRole: string
      summary: string
    consumers:
      - Notification   # notify approvers (opt-in, BR-NOTIF-01)
      - Core Platform  # audit projection
    idempotency: idempotent by changeRequestId; approval decision/rejection is audit-only (no enterprise event), activation emits EVT-006

