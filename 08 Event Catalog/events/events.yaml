      currentStatus: string
      priority: string
      sourceType: string
      sourceId: string
      targetType: string
      targetId: string   # nullable
      routing: object    # nullable ComplaintRoute snapshot
      contextReference: string
      payload: object
    consumers:
      - Dashboard        # future
      - Notification     # future
      - KPI              # future
      - Workflow         # future
      - AI               # future
    idempotency: idempotent by eventId; consumers ignore duplicates by eventId
