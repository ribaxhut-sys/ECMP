openapi: 3.0.3
info:
  title: ECMP Case Service API
  version: 1.3.0
  description: |
    ECMF case operations for Sprint-01 (create/get).
    Aligned to FRD-001 / FR-001 / FR-002 / FR-001c (write-audit).
    Versioning per ADR-006: URL prefix /v1; breaking changes bump the prefix.
    Error responses use the Error envelope {code, message, details?} for ALL 4xx/5xx.
  x-ear-id: API-100
  x-frd: FRD-001
servers:
  - url: http://localhost:8000/v1
    description: Local development
  - url: https://api.example.local/ecmp/v1
    description: Example deployed base
tags:
  - name: Cases
    description: Case create and retrieve
  - name: Operations
    description: Operational endpoints (unversioned, no auth)
paths:
  /health:
    servers:
      - url: http://localhost:8000
        description: Health is served at root, outside the /v1 prefix (ADR-006)
    get:
      summary: Service health check
      operationId: health
      tags: [Operations]
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  sprint:
                    type: string
                    description: Active sprint label (informational)
  /cases:
    post:
      summary: Create case
      operationId: createCase
      description: |
        Not idempotent (DEC-002 defers idempotency keys): a client retry after a
        timeout creates a second case. Callers should confirm before retrying.
      x-ear-id: API-001
      x-fr: FR-001
      x-event: EVT-001
      tags: [Cases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseCreateRequest"
            examples:
              complaint:
                value:
                  customerId: "CUST-10001"
                  caseType: COMPLAINT
                  priority: HIGH
                  subject: "Billing discrepancy"
                  description: "Customer reports incorrect charge on last invoice."
                  channel: CALL
      responses:
        "201":
          description: Case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Validation error (code=VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token (code=UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but missing permission cases:create (code=FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error (code=INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cases/{caseId}:
    get:
      summary: Get case by id
      operationId: getCase
      x-ear-id: API-002
      x-fr: FR-002
      tags: [Cases]
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "401":
          description: Missing or invalid token (code=UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but missing permission cases:read (code=FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Case not found (code=NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error (code=INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Target: JWT signed by IdP (ADR-007 target phase); bearerFormat will be
        declared JWT once the target phase lands (kept out now so the
        machine-readable contract matches the slice-phase static-token reality).
        Slice phase (DEV/CI only): static env token; claims {userId, permissions[]}.
        401 = authentication failure; 403 = missing permission.
  schemas:
    CaseType:
      type: string
      enum: [COMPLAINT, INQUIRY]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    CaseStatus:
      type: string
      enum: [REGISTERED]
      description: Sprint-01 supports initial status only
    CaseCreateRequest:
      type: object
      required: [customerId, caseType, priority, subject, description]
      properties:
        customerId:
          type: string
          minLength: 1
          maxLength: 64
        caseType:
          $ref: "#/components/schemas/CaseType"
        priority:
          $ref: "#/components/schemas/Priority"
        subject:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 5000
        channel:
          type: string
          nullable: true
          maxLength: 32
    Case:
      type: object
      description: |
        Case representation. The DB audit column updated_by is intentionally
        NOT exposed in API responses (contract policy, see 21 Technical Standards §4).
      required:
        [caseId, customerId, caseType, priority, subject, description, status, createdAt, createdBy, updatedAt]
      properties:
        caseId:
          type: string
          pattern: "^CASE-[0-9A-F]{10}$"
          description: System generated, format CASE-<10-hex> (FRD-001 §7)
        customerId:
          type: string
        caseType:
          $ref: "#/components/schemas/CaseType"
        priority:
          $ref: "#/components/schemas/Priority"
        subject:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/CaseStatus"
        channel:
          type: string
          nullable: true
          maxLength: 32
        customerVerified:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
          description: ISO-8601, always UTC (FRD-001 §7)
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601, always UTC (FRD-001 §7)
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
security:
  - bearerAuth: []
