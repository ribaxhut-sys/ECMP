openapi: 3.0.3
info:
  title: ECMP Case Service API
  version: 1.5.0
  description: |
    ECMF case operations: create/get (Sprint-01, FRD-001), lifecycle actions
    assign/status (Sprint-02B, FRD-002), and paginated/filtered list (Sprint-03B,
    FRD-001 v0.4 FR-005). Consolidated from the formerly separate case-actions.v1.yaml
    (frozen at gate G1, DEC-006) into this single normative spec per DEC-006 D6/U-6 —
    Sprint-03A governance sync.
    Versioning per ADR-006: URL prefix /v1; breaking changes bump the prefix.
    Error responses use the Error envelope {code, message, details?} for ALL 4xx/5xx.
  x-ear-id: API-100
  x-frd: FRD-001
  x-frd-additional: FRD-002
servers:
  - url: http://localhost:8000/v1
    description: Local development
  - url: https://api.example.local/ecmp/v1
    description: Example deployed base
tags:
  - name: Cases
    description: Case create, retrieve, and lifecycle actions (assign, status transition)
  - name: Operations
    description: Operational endpoints (unversioned, no auth)
paths:
  /health:
    servers:
      - url: http://localhost:8000
        description: Health is served at root, outside the /v1 prefix (ADR-006)
    get:
      summary: Service health check
      operationId: health
      tags: [Operations]
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  sprint:
                    type: string
                    description: Active sprint label (informational)
  /cases:
    get:
      summary: List cases (paginated, filtered)
      operationId: listCases
      x-ear-id: API-005
      x-fr: FR-005
      tags: [Cases]
      description: |
        Paginated case list per 21 Technical Standards §3: page starts at 1
        (default 1); pageSize default 20, max 100 — pageSize > 100 returns 400
        VALIDATION_ERROR. Requires permission `cases:read`; results are not yet
        org-scoped (org scoping follows SEC-RAM-001 revisions, tracked separately).
        Sort is fixed: createdAt descending (CTO decision, Sprint-03B design
        review — configurable sort is out of scope for this version).
        Filters (status, priority, caseType, assigneeId) are optional and may be
        combined; unmatched filters return an empty page (200), not an error.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CaseStatus"
        - name: priority
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Priority"
        - name: caseType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CaseType"
        - name: assigneeId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Page of cases sorted by createdAt descending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePage"
              examples:
                firstPage:
                  value:
                    items:
                      - caseId: "CASE-00AB12CD34"
                        customerId: "CUST-10001"
                        caseType: COMPLAINT
                        priority: HIGH
                        subject: "Billing discrepancy"
                        description: "Customer reports incorrect charge on last invoice."
                        status: ASSIGNED
                        channel: CALL
                        customerVerified: false
                        assigneeId: "USR-2001"
                        unitId: "UNIT-01"
                        createdAt: "2026-07-21T08:15:00Z"
                        createdBy: "cs.agent.1"
                        updatedAt: "2026-07-21T09:00:00Z"
                    page: 1
                    pageSize: 20
                    totalItems: 42
        "400":
          description: Invalid pagination/filter parameter, e.g. pageSize > 100 (code=VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token (code=UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but missing permission cases:read (code=FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error (code=INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create case
      operationId: createCase
      description: |
        Not idempotent (DEC-002 defers idempotency keys): a client retry after a
        timeout creates a second case. Callers should confirm before retrying.
      x-ear-id: API-001
      x-fr: FR-001
      x-event: EVT-001
      tags: [Cases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseCreateRequest"
            examples:
              complaint:
                value:
                  customerId: "CUST-10001"
                  caseType: COMPLAINT
                  priority: HIGH
                  subject: "Billing discrepancy"
                  description: "Customer reports incorrect charge on last invoice."
                  channel: CALL
      responses:
        "201":
          description: Case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Validation error (code=VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token (code=UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but missing permission cases:create (code=FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error (code=INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cases/{caseId}:
    get:
      summary: Get case by id
      operationId: getCase
      x-ear-id: API-002
      x-fr: FR-002
      tags: [Cases]
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "401":
          description: Missing or invalid token (code=UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but missing permission cases:read (code=FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Case not found (code=NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error (code=INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cases/{caseId}/assign:
    post:
      summary: Assign or reassign case
      operationId: assignCase
      x-ear-id: API-003
      x-fr: FR-003
      x-event: [EVT-002, EVT-003]
      tags: [Cases]
      description: |
        Assign/reassign a case to a handler/unit (business action AssignCase,
        DOM-ECMF-002). Contract frozen at gate G1 (DEC-006); implemented Sprint-02B.

        Guards (BR-002 / BR-ECMF-02, DOM-ECMF-003):
        - Caller needs permission `cases:assign` (SEC-RAM-001 v0.3, role Supervisor).
        - Cross-unit assignment only by the supervisor of the case's owning unit;
          org-unit enforcement follows the L-3 closure decision (SEC-LIM-001).
        - Allowed only from status `REGISTERED` or `REOPENED` (transition matrix
          REGISTERED→ASSIGNED and REOPENED→ASSIGNED); any other current status →
          409 (code=INVALID_STATE).
        - `assigneeId` / `unitId` must be valid.

        Emits (in the same transaction via outbox, ADR-009 / BR-008; payloads per
        08 Event Catalog/events/events.yaml, frozen at G1):
        - EVT-002 CaseAssigned {caseId, assigneeId, unitId, assignedBy,
          previousAssigneeId (nullable — set on reassignment), assignedAt}
        - EVT-003 StatusChanged {caseId, fromStatus, toStatus, changedBy, changedAt,
          reason (nullable)} — every valid transition emits EVT-003 (DOM-ECMF-003)
        Audit action: `case.assign` (immutable, same transaction, BR-008).
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRequest"
            examples:
              assign:
                value:
                  assigneeId: "USR-2001"
                  unitId: "UNIT-01"
      responses:
        "200":
          description: Case assigned; status is now ASSIGNED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Validation error, e.g. missing assigneeId/unitId (code=VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token (code=UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            Authenticated but not allowed: missing permission cases:assign, or
            cross-unit assignment by non-supervisor (BR-002) (code=FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Case not found (code=NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Case not in an assignable status — current status has no →ASSIGNED
            transition in the active workflow config (code=INVALID_STATE);
            state unchanged, no event emitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error (code=INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cases/{caseId}/status:
    post:
      summary: Change case status via allowed transition
      operationId: changeCaseStatus
      x-ear-id: API-004
      x-fr: FR-004
      x-event: [EVT-003]
      tags: [Cases]
      description: |
        Transition a case to a new status (business action TransitionStatus,
        DOM-ECMF-002). Contract frozen at gate G1 (DEC-006); implemented
        Sprint-02B. Transitions are validated against the active Workflow Config;
        the baseline matrix is DOM-ECMF-003 (CASE_STATE_MACHINE.md):
        REGISTERED→ASSIGNED, ASSIGNED→IN_PROGRESS, IN_PROGRESS→PENDING_REVIEW,
        PENDING_REVIEW→CLOSED, PENDING_REVIEW→IN_PROGRESS, CLOSED→REOPENED,
        REOPENED→ASSIGNED, REOPENED→IN_PROGRESS. CLOSED→REOPENED is documented
        here as part of the baseline matrix but is not yet reachable in the
        active runtime config (DEC-006 U-1/U-4 — see workflow.py).

        Guards (BR-001 / BR-ECMF-03, DOM-ECMF-003):
        - Caller needs permission `cases:status` (frozen name, DEC-006; SEC-RAM-001
          v0.3, role Handler baseline).
        - Per-transition guards apply (e.g. only assignee may start handling).
        - `resolutionCode` is MANDATORY for transitions to CLOSED (BR-ECMF-06);
          evidence handling is out of Sprint-02 scope (FRD-002 §8).
        - `reason` is optional in general but MANDATORY for Administrator override
          transitions (exception BR-ECMF-03) and for CLOSED→REOPENED (BR-ECMF-07).
        - Illegal transition → 409 (code=INVALID_TRANSITION), state unchanged,
          no event emitted. Frozen decision DEC-006: 400 stays reserved for
          payload validation.

        Emits on valid transition only (same transaction via outbox, ADR-009):
        - EVT-003 StatusChanged {caseId, fromStatus, toStatus, changedBy, changedAt,
          reason (nullable; mandatory for override and reopen)} — payload frozen at G1
        - Specific events per matrix (EVT-005 CaseClosed on →CLOSED, EVT-007
          CaseReopened on CLOSED→REOPENED) are documented in DOM-ECMF-003;
          activation of the reopen flow depends on DEC-006 U-1/U-4.
        Audit action: `case.status_change` (immutable, same transaction, BR-008).
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChangeRequest"
            examples:
              startHandling:
                value:
                  toStatus: IN_PROGRESS
              closeWithResolution:
                value:
                  toStatus: CLOSED
                  resolutionCode: "RESOLVED_REFUND"
              reopenWithReason:
                value:
                  toStatus: REOPENED
                  reason: "Customer reports issue recurred within 30 days"
      responses:
        "200":
          description: Transition applied; response reflects the new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: |
            Validation error, e.g. toStatus not a known enum value, or
            resolutionCode/reason missing where mandatory (code=VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token (code=UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but missing permission cases:status or per-transition guard fails (code=FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Case not found (code=NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Illegal transition — fromStatus→toStatus not in the active workflow
            config (code=INVALID_TRANSITION); case state unchanged, no event emitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error (code=INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Target: JWT signed by IdP (ADR-007 target phase; design ADR-012);
        bearerFormat will be declared JWT once the target phase lands (kept out
        now so the machine-readable contract matches the slice-phase
        static-token reality).
        Slice phase (DEV/CI only): static env token; claims {userId, permissions[]}.
        401 = authentication failure; 403 = missing permission.
  schemas:
    CaseType:
      type: string
      enum: [COMPLAINT, INQUIRY]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    CaseStatus:
      type: string
      enum: [REGISTERED, ASSIGNED, IN_PROGRESS, PENDING_REVIEW, CLOSED, REOPENED]
      description: |
        Full baseline status set per DOM-ECMF-003 (SoT for enum values).
        Sprint-03A note: this enum was previously split across two files
        (case-service.v1.yaml declared REGISTERED only; case-actions.v1.yaml
        declared the full set) because case-service predated Sprint-02B
        implementation. Now that assign/status are implemented and both specs
        are consolidated, this is the single enum definition — no value change.
    CaseCreateRequest:
      type: object
      required: [customerId, caseType, priority, subject, description]
      properties:
        customerId:
          type: string
          minLength: 1
          maxLength: 64
        caseType:
          $ref: "#/components/schemas/CaseType"
        priority:
          $ref: "#/components/schemas/Priority"
        subject:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 5000
        channel:
          type: string
          nullable: true
          maxLength: 32
    AssignRequest:
      type: object
      required: [assigneeId, unitId]
      properties:
        assigneeId:
          type: string
          minLength: 1
          maxLength: 64
          description: Target handler principal id
        unitId:
          type: string
          minLength: 1
          maxLength: 64
          description: Organizational unit owning the assignment (BR-002)
    StatusChangeRequest:
      type: object
      required: [toStatus]
      properties:
        toStatus:
          $ref: "#/components/schemas/CaseStatus"
        resolutionCode:
          type: string
          nullable: true
          maxLength: 64
          description: |
            Resolution code (master data, Administration FRD-007 FR-059);
            MANDATORY for transitions to CLOSED (BR-ECMF-06), ignored otherwise.
            Aligned with EVT-005 CaseClosed payload field resolutionCode.
        reason:
          type: string
          nullable: true
          maxLength: 1000
          description: |
            Optional; MANDATORY for Administrator override transitions
            (BR-ECMF-03 exception) and for CLOSED→REOPENED (BR-ECMF-07)
    Case:
      type: object
      description: |
        Case representation, including lifecycle fields (assigneeId/unitId) added
        in Sprint-02B. The DB audit column updated_by is intentionally NOT exposed
        in API responses (contract policy, see 21 Technical Standards §4).
      required:
        [caseId, customerId, caseType, priority, subject, description, status, createdAt, createdBy, updatedAt]
      properties:
        caseId:
          type: string
          pattern: "^CASE-[0-9A-F]{10}$"
          description: System generated, format CASE-<10-hex> (FRD-001 §7)
        customerId:
          type: string
        caseType:
          $ref: "#/components/schemas/CaseType"
        priority:
          $ref: "#/components/schemas/Priority"
        subject:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/CaseStatus"
        channel:
          type: string
          nullable: true
          maxLength: 32
        customerVerified:
          type: boolean
          default: false
        assigneeId:
          type: string
          nullable: true
          description: Current assignee (null until first assignment)
        unitId:
          type: string
          nullable: true
          description: Current owning unit (null until first assignment)
        createdAt:
          type: string
          format: date-time
          description: ISO-8601, always UTC (FRD-001 §7)
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601, always UTC (FRD-001 §7)
    CasePage:
      type: object
      description: Paginated list per PageMeta convention (21 Technical Standards §3)
      required: [items, page, pageSize, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Case"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
security:
  - bearerAuth: []
