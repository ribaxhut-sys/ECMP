openapi: 3.0.3
info:
  title: ECMP Queue Service API
  version: 1.1.0
  description: |
    Queue REST API — CRUD foundation (TASK-064) plus operational lifecycle
    (CAPABILITY-003). Queue is visit context only — not the business.
    Queue and Complaint have independent lifecycles.
    Display, Kiosk, Voice, Redis, WebSocket, Notification, Complaint,
    Authentication, and Authorization are out of scope.
    Ticket numbers are generated by Domain (default A001, A002, …).
    Core Request Context (CAPABILITY-002) prepares for future Auth.
  x-ear-id: API-360
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Queues
    description: Queue aggregate CRUD (visit context)
  - name: Queue Tickets
    description: QueueTicket CRUD / issue (0..N Complaints may link later)
  - name: Queue Operations
    description: Operational lifecycle (issue / call-next / recall / complete / skip / cancel / open / close)
  - name: Queue Counters
    description: Service counter CRUD (no kiosk / display)
paths:
  /api/v1/queues:
    post:
      summary: Create queue
      operationId: createQueue
      x-ear-id: API-360
      tags: [Queues]
      security: []
      description: Create a visit-context Queue. Default status CLOSED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQueueRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List queues by organization
      operationId: listQueues
      x-ear-id: API-361
      tags: [Queues]
      security: []
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/queues/{queueId}:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    get:
      summary: Get queue by id
      operationId: getQueue
      x-ear-id: API-362
      tags: [Queues]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDataResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Update queue
      operationId: updateQueue
      x-ear-id: API-363
      tags: [Queues]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQueueRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Delete queue
      operationId: deleteQueue
      x-ear-id: API-364
      tags: [Queues]
      security: []
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/queues/{queueId}/tickets:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    post:
      summary: Issue queue ticket
      operationId: createQueueTicket
      x-ear-id: API-365
      tags: [Queue Tickets]
      security: []
      description: Issue WAITING ticket for an OPEN queue. Auto ticket number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List tickets for queue
      operationId: listQueueTickets
      x-ear-id: API-366
      tags: [Queue Tickets]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tickets/{ticketId}:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    get:
      summary: Get ticket by id
      operationId: getQueueTicket
      x-ear-id: API-367
      tags: [Queue Tickets]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDataResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Update ticket
      operationId: updateQueueTicket
      x-ear-id: API-368
      tags: [Queue Tickets]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Delete ticket
      operationId: deleteQueueTicket
      x-ear-id: API-369
      tags: [Queue Tickets]
      security: []
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/queues/{queueId}/counters:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    post:
      summary: Create queue counter
      operationId: createQueueCounter
      x-ear-id: API-370
      tags: [Queue Counters]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCounterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterDataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List counters for queue
      operationId: listQueueCounters
      x-ear-id: API-371
      tags: [Queue Counters]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/counters/{counterId}:
    parameters:
      - $ref: "#/components/parameters/CounterId"
    put:
      summary: Update counter
      operationId: updateQueueCounter
      x-ear-id: API-372
      tags: [Queue Counters]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCounterRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterDataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Delete counter
      operationId: deleteQueueCounter
      x-ear-id: API-373
      tags: [Queue Counters]
      security: []
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/queues/{queueId}/open:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    post:
      summary: Open queue
      operationId: openQueue
      x-ear-id: API-374
      tags: [Queue Operations]
      security: []
      description: Set queue status to OPEN.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDataResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/queues/{queueId}/close:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    post:
      summary: Close queue
      operationId: closeQueue
      x-ear-id: API-375
      tags: [Queue Operations]
      security: []
      description: Set queue status to CLOSED. New tickets are rejected.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDataResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/queues/{queueId}/issue-ticket:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    post:
      summary: Issue ticket (operation)
      operationId: issueTicketOperation
      x-ear-id: API-376
      tags: [Queue Operations]
      security: []
      description: |
        Domain generates ticket number (default A001…) and issues WAITING.
        Queue must be OPEN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/queues/{queueId}/call-next:
    parameters:
      - $ref: "#/components/parameters/QueueId"
    post:
      summary: Call next ticket
      operationId: callNextTicket
      x-ear-id: API-377
      tags: [Queue Operations]
      security: []
      description: |
        Select next WAITING ticket by policy → CALLED.
        Returns 204 when no waiting tickets.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDataResponse"
        "204":
          description: No waiting tickets
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tickets/{ticketId}/recall:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    post:
      summary: Recall ticket
      operationId: recallTicket
      x-ear-id: API-378
      tags: [Queue Operations]
      security: []
      description: Re-announce CALLED or SERVING ticket. Status unchanged.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDataResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tickets/{ticketId}/complete:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    post:
      summary: Complete ticket
      operationId: completeTicket
      x-ear-id: API-379
      tags: [Queue Operations]
      security: []
      description: CALLED / SERVING → COMPLETED (domain-validated).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDataResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tickets/{ticketId}/skip:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    post:
      summary: Skip ticket
      operationId: skipTicket
      x-ear-id: API-380
      tags: [Queue Operations]
      security: []
      description: WAITING / CALLED → SKIPPED (domain-validated).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDataResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tickets/{ticketId}/cancel:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    post:
      summary: Cancel ticket
      operationId: cancelTicket
      x-ear-id: API-381
      tags: [Queue Operations]
      security: []
      description: WAITING / CALLED / SERVING → CANCELLED (domain-validated).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDataResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    QueueId:
      name: queueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CounterId:
      name: counterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          nullable: true
    QueueStatus:
      type: string
      enum: [OPEN, PAUSED, CLOSED]
    QueuePolicy:
      type: string
      enum: [FIFO, PRIORITY_QUEUE]
    QueuePriority:
      type: string
      enum: [NORMAL, PRIORITY, VIP]
    QueueTicketStatus:
      type: string
      enum: [WAITING, CALLED, SERVING, COMPLETED, CANCELLED, SKIPPED]
    CreateQueueRequest:
      type: object
      required: [organizationId, name]
      properties:
        organizationId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        policy:
          $ref: "#/components/schemas/QueuePolicy"
        status:
          $ref: "#/components/schemas/QueueStatus"
    UpdateQueueRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        policy:
          $ref: "#/components/schemas/QueuePolicy"
        status:
          $ref: "#/components/schemas/QueueStatus"
    QueueResponse:
      type: object
      required: [queueId, organizationId, name, description, status, policy]
      properties:
        queueId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/QueueStatus"
        policy:
          $ref: "#/components/schemas/QueuePolicy"
    QueueDataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/QueueResponse"
    QueueListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/QueueResponse"
    CreateTicketRequest:
      type: object
      properties:
        priority:
          $ref: "#/components/schemas/QueuePriority"
    UpdateTicketRequest:
      type: object
      properties:
        priority:
          $ref: "#/components/schemas/QueuePriority"
        status:
          $ref: "#/components/schemas/QueueTicketStatus"
    QueueTicketResponse:
      type: object
      required: [ticketId, queueId, ticketNumber, priority, status, createdAt]
      properties:
        ticketId:
          type: string
          format: uuid
        queueId:
          type: string
          format: uuid
        ticketNumber:
          type: string
        priority:
          $ref: "#/components/schemas/QueuePriority"
        status:
          $ref: "#/components/schemas/QueueTicketStatus"
        createdAt:
          type: string
          format: date-time
    TicketDataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/QueueTicketResponse"
    TicketListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/QueueTicketResponse"
    CreateCounterRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: "#/components/schemas/QueueStatus"
    UpdateCounterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: "#/components/schemas/QueueStatus"
    QueueCounterResponse:
      type: object
      required: [counterId, queueId, name, status]
      properties:
        counterId:
          type: string
          format: uuid
        queueId:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: "#/components/schemas/QueueStatus"
    CounterDataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/QueueCounterResponse"
    CounterListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/QueueCounterResponse"
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict / Invalid State
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
