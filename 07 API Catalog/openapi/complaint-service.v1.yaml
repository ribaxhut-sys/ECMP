openapi: 3.0.3
info:
  title: ECMP Complaint Service API
  version: 1.0.0
  description: |
    ECMP v1.0.0 Production contract. Complaint CRUD, assignment,
    escalation, appointment booking, resolution, timeline, reporting, user management,
    and production authentication. Paths use `/api/v1` prefix. Dashboard exports,
    OAuth/SSO/LDAP/MFA, social login, production SMTP/WhatsApp/FCM providers,
    and workflow-engine APIs are out of scope. Identity & Password Management
    (API-410–413: forgot/reset/change/admin-reset password; force password change;
    EmailService logging provider) is in scope.
    Ownership (DEC-026 Accepted with Conditions, M-026-2): `/api/v1/complaints`
    lifecycle is **retired / unmounted** in production. Canonical complaint HTTP
    is `/api/v1/cm` (complaint-management-batch1). This catalog remains historical
    for foundation path contracts; do not treat those paths as live product APIs.
    CA BC ticket-nested routes are not retired by DEC-026.
    SLA foundation read (API-314), SLA policy configuration (API-315–317),
    SLA deadline calculation at complaint create (TASK-023 / DEC-012),
    SLA status evaluation / breach detection (TASK-024 / DEC-013),
    SLA timeline integration (TASK-025 / DEC-014), KPI Foundation
    summary (TASK-026 / DEC-015 / API-318), Dashboard Summary
    orchestration (TASK-027 / DEC-016 / API-319), System Settings
    (TASK-028 / API-320–322), Attachment Management
    (CAPABILITY-011 / API-323–326, 386–387 generic aggregate attachments),
    Notification Foundation
    (TASK-030 / API-327–335), Notification Domain
    (CAPABILITY-009 / API-356–357 retry + stub process), Activity Timeline
    (CAPABILITY-010 / API-382–385 append-only timeline_entries), Search &
    Filtering (CAPABILITY-012 / API-388 Complaint search — SQLAlchemy only),
    Dashboard & KPI aggregation
    (CAPABILITY-013 / API-389–394 widgets + API-319 overview),
    Audit Log
    (TASK-031 / API-336–337), Role Management
    (TASK-033 / API-338–342), Permission Management
    (TASK-034 / API-343–347), Role-Permission Matrix
    (TASK-035 / API-348–350), User-Role Assignment
    (TASK-036 / API-351–353), and Data Scope Foundation
    (TASK-037 / API-354–355) are in scope. Countdown timers,
    schedulers, and real notification providers (SMTP/Twilio/FCM)
    remain out of scope; CAPABILITY-009 uses stub providers only.
    Error responses use the Error envelope {code, message, details} for ALL 4xx/5xx
    (`details` may be null). Success responses use {data} or {data, meta} wrappers.
  x-ear-id: API-200
  x-ecmp-dec: DEC-026
  x-ecmp-ownership: Foundation / legacy complaint lifecycle (HTTP retired)
  x-ecmp-status: Retired unmounted (DEC-026 M-026-2) — catalog historical
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Auth
    description: Login, refresh, logout, and current-user profile
  - name: Complaints
    description: Complaint create, list, get, and update
  - name: Assignments
    description: Complaint assignment and reassignment (Supervisor only)
  - name: Escalations
    description: Complaint escalation and Escalation Request (Branch → HO)
  - name: Appointments
    description: Head Office appointment booking for APPROVED escalations (TASK-014)
  - name: Resolutions
    description: Complaint resolution (IN_PROGRESS → RESOLVED)
  - name: SLA
    description: |
      SLA records (API-314) with immutable deadline snapshots (TASK-023) and
      status evaluation PENDING / COMPLETED / BREACHED from stored due_at
      (TASK-024 / DEC-013). Configurable policies (API-315–317). No countdown
      timers or schedulers.
  - name: Timeline
    description: |
      Legacy immutable complaint_timelines read API (API-209). Distinct from
      CAPABILITY-010 ActivityTimeline on timeline_entries.
  - name: ActivityTimeline
    description: |
      CAPABILITY-010 reusable append-only activity history (timeline_entries).
      Domains emit events; Timeline records. No update/delete.
  - name: Search
    description: |
      CAPABILITY-012 reusable Search & Filtering (read-only). Combinable
      filters, keyword, sort, and DB-side pagination. Initially Complaint
      only (API-388). No Elasticsearch / OpenSearch / vector search.
  - name: Reports
    description: Complaint reporting aggregations (read-only)
  - name: KPI
    description: |
      KPI Foundation live aggregations over operational data (API-318 /
      TASK-026). Read-only; no KPI tables, scheduler, or charts.
  - name: Dashboard
    description: |
      CAPABILITY-013 Dashboard & KPI read-only aggregation (API-389–394):
      complaint / queue / SLA / notification / trends / KPI rates via SQL
      aggregates on existing tables. API-319 overview composition
      (TASK-027 / DEC-016) remains at GET /dashboard/overview.
      No dashboard tables, charts, caching, websocket, or domain writes.
  - name: Settings
    description: |
      System Settings key/value configuration (API-320–322 / TASK-028).
      Typed values (STRING/INTEGER/BOOLEAN/JSON/URL/EMAIL) with PUBLIC or
      PROTECTED visibility. Public list requires no auth; full list and
      updates require settings:read / settings:update.
  - name: Attachments
    description: |
      Generic platform Attachment Management (CAPABILITY-011 / API-323–326,
      API-386–387). Aggregate-bound via aggregate_type + aggregate_id
      (Complaint / Queue / Notification). Local StorageProvider behind
      settings storage.*; logical delete via status=DELETED. Metadata only —
      no Complaint/Queue/Notification business logic.
  - name: Notifications
    description: |
      Notification Foundation (API-327–335 / TASK-030). Templates CRUD and
      queue enqueue/cancel only. No SMTP, WhatsApp, FCM, scheduler, or
      retry worker. Soft-delete templates via is_active=false.
  - name: Audit
    description: |
      Platform Audit Log (API-336–337 / TASK-031). Append-only system
      activity (not Complaint Timeline). Synchronous writes; secrets
      redacted. No realtime bus / search engine / dashboard.
  - name: Roles
    description: |
      Role Management master data (API-338–342 / TASK-033). CRUD for
      roles table with is_system protection.
  - name: Permissions
    description: |
      Permission Management master data (API-343–347 / TASK-034). CRUD
      for permissions table with is_system protection and module:action
      code format.
  - name: Role Permissions
    description: |
      Role-Permission Matrix (API-348–350 / TASK-035). Assign / replace
      permissions on a role. Matrix feeds Dynamic Permission Resolver
      (TASK-038). Cache invalidated on matrix writes.
  - name: User Roles
    description: |
      User-Role Assignment (API-351–353 / TASK-036). Many-to-many
      user↔role junction (`user_roles`). Feeds Dynamic Permission
      Resolver (TASK-038). Does not replace `users.role_id`. Data Scope
      filtering remains out of scope.
  - name: Data Scopes
    description: |
      Data Scope Foundation (API-354–355 / TASK-037) plus Enforcement
      helpers (TASK-039) and Authorization Middleware pipeline (TASK-040).
      Role-bound scope rules (GLOBAL / ORGANIZATION / BRANCH / SELF /
      CUSTOM). Authorization Layer exposes `DataScopeResolver`,
      `resolve_effective_scope`, and `require_data_scope` for opt-in use
      on the shared AuthN → Permission → (optional) Data Scope pipeline.
      Automatic filtering of all domain endpoints remains out of scope.
  - name: Users
    description: User management (create, list, update, soft deactivate)
  - name: Customers
    description: Local customer reference cache (read-only; not Customer Master SoR)
  - name: Branches
    description: Branch reference list (read-only; for complaint FK selection)
paths:
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      x-ear-id: API-218
      tags: [Auth]
      security: []
      description: |
        Authenticates with username (or email) and password via bcrypt.
        Returns a JWT access token (15 minutes) with `sub` + `roles`
        claims. Effective permissions are **not** embedded in the JWT —
        they are resolved per request via Dynamic Permission Resolver
        (TASK-038: User → UserRole → Role → RolePermission → Permission).
        Sets an HttpOnly Secure SameSite=Lax refresh cookie (7 days).
        Emits audit event `auth.login`. Tokens are never written to
        application logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              description: |
                Refresh token cookie (`ecmp_refresh_token`). HttpOnly; Secure
                outside development; SameSite=Lax; Path=/api/v1/auth.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      operationId: refreshAccessToken
      x-ear-id: API-219
      tags: [Auth]
      security: []
      description: |
        Rotates the refresh token from the HttpOnly cookie and returns a new
        access token. Previous refresh token is revoked. Emits `auth.refresh`.
      responses:
        "200":
          description: Tokens rotated
          headers:
            Set-Cookie:
              description: Rotated refresh token cookie
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDataResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      x-ear-id: API-220
      tags: [Auth]
      security: []
      description: |
        Revokes the refresh token from the cookie (if present) and clears the
        cookie. Emits `auth.logout` when a token was revoked. Idempotent.
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              description: Cleared refresh token cookie
              schema: { type: string }
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/me:
    get:
      summary: Current authenticated user
      operationId: getCurrentUser
      x-ear-id: API-221
      tags: [Auth]
      security:
        - bearerAuth: []
      description: |
        Returns the caller profile plus roles and permissions derived from the
        access token subject. Password hash is never returned.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeDataResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/forgot-password:
    post:
      summary: Request password reset
      operationId: forgotPassword
      x-ear-id: API-410
      tags: [Auth]
      security: []
      description: |
        Accepts an email and, when an active account exists, creates a single-use
        password-reset token (15 minutes, SHA-256 hash only at rest) and delivers
        a reset link via EmailService. Always returns the same message — never
        reveals whether the email exists. Emits audit `password.reset_requested`
        only when a token is issued. Raw tokens and passwords are never logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Always returns opaque success message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordDataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/reset-password:
    post:
      summary: Reset password with token
      operationId: resetPassword
      x-ear-id: API-411
      tags: [Auth]
      security: []
      description: |
        Verifies the reset token hash, rejects expired or already-used tokens,
        updates the password (bcrypt), marks the token used, revokes refresh
        tokens, and clears `forcePasswordChange`. Emits `password.reset_completed`
        (or expired/reused failure audits).
        Failure responses use a generic message; `details.reason` may be
        `invalid`, `expired`, `reused`, or `inactive_user` for UI handling
        without revealing account existence beyond the token outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordDataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/complaints:
    post:
      summary: Create complaint
      operationId: createComplaint
      x-ear-id: API-201
      tags: [Complaints]
      security:
        - bearerAuth: []
      description: |
        Creates a complaint in status `NEW`.
        Requires an active SLA policy (TASK-023 / DEC-012): evaluates the
        active policy once and persists an immutable SLA deadline snapshot
        on `sla_records` (statuses remain `PENDING`). Rejects with
        `VALIDATION_ERROR` when no active policy exists.
        Requires permission `complaints:create`.
        Writes audit log `complaint.create` in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List complaints
      operationId: listComplaints
      x-ear-id: API-202
      tags: [Complaints]
      security:
        - bearerAuth: []
      description: |
        Paginated list (page default 1, pageSize default 20, max 100).
        Sort fixed: createdAt descending. Soft-deleted rows are excluded.
        Requires permission `complaints:read`.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ComplaintStatus" }
        - name: priority
          in: query
          schema: { $ref: "#/components/schemas/Priority" }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Page of complaints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/complaints/search:
    get:
      summary: Search and filter complaints
      operationId: searchComplaints
      x-ear-id: API-388
      tags: [Search]
      security:
        - bearerAuth: []
      description: |
        CAPABILITY-012 Complaint search (read-only). Combinable filters,
        case-insensitive keyword over complaint number / subject /
        description / reporter name (customer.full_name), sort, and
        database-side pagination. Soft-deleted rows are excluded.
        Requires permission `complaints:read`. No search engine —
        SQLAlchemy / PostgreSQL only.
      parameters:
        - name: keyword
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
          description: |
            Case-insensitive match on complaintNumber, subject,
            description, reporter name (customer.full_name). Reference
            number maps to complaintNumber.
          example: CMP-ABC
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ComplaintStatus" }
          example: NEW
        - name: priority
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Priority" }
          example: HIGH
        - name: category
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: branchId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: assignedTo
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Current assignee (complaint_assignments.is_current)
        - name: createdBy
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: createdFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Inclusive lower bound on createdAt
        - name: createdTo
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Inclusive upper bound on createdAt
        - name: slaStatus
          in: query
          required: false
          schema: { $ref: "#/components/schemas/SlaStatus" }
          description: Filter by sla_records.overall_status
        - name: escalated
          in: query
          required: false
          schema: { type: boolean }
          description: |
            true = status ESCALATED or any non-deleted escalation row;
            false = neither
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [createdAt, updatedAt, priority, status, slaDueDate]
            default: createdAt
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Search result page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintSearchResponse"
              example:
                items:
                  - id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                    complaintNumber: CMP-ABC1234567
                    subject: Billing dispute
                    status: NEW
                    priority: HIGH
                pagination:
                  page: 1
                  pageSize: 20
                  totalItems: 1
                  totalPages: 1
                  hasNext: false
                  hasPrevious: false
                filtersApplied:
                  priority: HIGH
                  keyword: Billing
                sort:
                  field: createdAt
                  order: desc
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/complaints/{id}:
    get:
      summary: Get complaint by id
      operationId: getComplaint
      x-ear-id: API-203
      tags: [Complaints]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      responses:
        "200":
          description: Complaint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDataResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Update complaint
      operationId: updateComplaint
      x-ear-id: API-204
      tags: [Complaints]
      security:
        - bearerAuth: []
      description: |
        Partial update of mutable fields. Status is intentionally immutable here —
        use `PATCH /api/v1/complaints/{id}/status` (API-224) for validated transitions,
        or Assign (API-205) for `NEW` → `ASSIGNED`.
        Requires permission `complaints:update`.
        Writes audit log `complaint.update` in the same transaction.
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/complaints/{id}/status:
    patch:
      summary: Change complaint status
      operationId: changeComplaintStatus
      x-ear-id: API-224
      tags: [Complaints]
      security:
        - bearerAuth: []
      description: |
        Validated lifecycle status transition (TASK-009). This is the sole write
        path for status except Assign (`NEW`→`ASSIGNED`), Resolution
        (`IN_PROGRESS`→`RESOLVED` via API-225), and Escalation (`→ESCALATED`).
        Invalid transitions return 400 VALIDATION_ERROR
        ("Invalid status transition."). Writes timeline + audit in the same
        transaction. Requires permission `complaints:update`.

        Allowed matrix:
        - ASSIGNED → IN_PROGRESS
        - IN_PROGRESS → PENDING
        - PENDING → IN_PROGRESS
        - RESOLVED → CLOSED | IN_PROGRESS (reopen)
        - CLOSED → (none)
        - NEW → (none via this endpoint; use Assign)
        - RESOLVED via this endpoint is blocked — use POST .../resolution
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintStatusChangeRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/complaints/{id}/resolution:
    post:
      summary: Resolve complaint
      operationId: resolveComplaint
      x-ear-id: API-225
      tags: [Resolutions]
      security:
        - bearerAuth: []
      description: |
        Records a mandatory resolution and transitions status
        `IN_PROGRESS` → `RESOLVED` (TASK-010). Complaints must not be
        CLOSED without a resolution first — CLOSED remains available only
        from RESOLVED via API-224. Rejects any other status with 400
        VALIDATION_ERROR ("Complaint must be IN_PROGRESS before resolving.").
        Writes `complaint.resolved` timeline event and audit `complaint.resolve`
        in the same transaction. Requires permission `complaints:update`.
        `resolvedBy` is optional; when omitted, the authenticated user is used.
        When provided, it must match the authenticated user.
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveComplaintRequest"
            example:
              resolutionCategory: SOLVED
              rootCause: Configuration Error
              resolutionNotes: Restarted service and updated configuration.
              resolvedBy: "00000000-0000-0000-0000-000000000001"
      responses:
        "200":
          description: Resolved (status RESOLVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveComplaintDataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: Get current complaint resolution
      operationId: getComplaintResolution
      x-ear-id: API-226
      tags: [Resolutions]
      security:
        - bearerAuth: []
      description: |
        Returns the current (isCurrent=true) resolution for a complaint.
        404 when the complaint has no current resolution. Requires
        permission `complaints:read`.
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      responses:
        "200":
          description: Current resolution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolutionDataResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/complaints/{id}/final-resolution:
    post:
      summary: Submit final resolution
      operationId: submitFinalResolution
      x-ear-id: API-310
      tags: [Resolutions]
      security:
        - bearerAuth: []
      description: |
        Final Resolution after appointment `COMPLETED` (TASK-018 / DEC-011).
