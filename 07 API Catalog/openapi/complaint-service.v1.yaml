      x-ear-id: API-412
      tags: [Users]
      security:
        - bearerAuth: []
      description: |
        Authenticated self-service password change. Verifies `currentPassword`,
        enforces password policy (`PASSWORD_MIN_LENGTH`, not same as current),
        hashes with bcrypt, updates `updated_at`, clears `forcePasswordChange`,
        and revokes all refresh tokens. Emits `password.changed` or
        `password.change_failed`. Allowed even when `forcePasswordChange` is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordDataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/me/preferred-language:
    patch:
      summary: Update own preferred language
      operationId: updateOwnPreferredLanguage
      x-ear-id: API-414
      tags: [Users]
      security:
        - bearerAuth: []
      description: |
        Self-service update of `preferredLanguage` (`id` or `en`). Auth
        required; no additional permission beyond being logged in. Drives
        localization of outbound email (password reset, etc.) and, where
        resolved, API response messages for this user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferredLanguageUpdateRequest"
      responses:
        "200":
          description: Preferred language updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferredLanguageUpdateDataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/{id}:
    get:
      summary: Get user by id
      operationId: getUser
      x-ear-id: API-215
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Update user
      operationId: updateUser
      x-ear-id: API-216
      tags: [Users]
      security:
        - bearerAuth: []
      description: |
        Partial update of mutable fields. Optional password is re-hashed when provided.
        Username/email uniqueness enforced. Password hash is never returned.
        Requires permission `users:update`.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/{id}/roles:
    get:
      summary: List user roles
      operationId: getUserRoles
      x-ear-id: API-351
      tags: [User Roles]
      security:
        - bearerAuth: []
      description: |
        Lists roles assigned to a user via `user_roles` junction (TASK-036).
        Independent of primary `users.role_id`. Requires `user_role:read`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Role list for user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListDataResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Replace user roles
      operationId: replaceUserRoles
      x-ear-id: API-352
      tags: [User Roles]
      security:
        - bearerAuth: []
      description: |
        Replaces the full role set for a user (TASK-036). Empty `roleIds`
        clears all junction links. Duplicate ids rejected. Missing
        user/role → 404. System roles may be assigned. Does not mutate
        `users.role_id`. Emits audit `user.roles.updated`.
        Requires `user_role:update`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRolesReplaceRequest"
      responses:
        "200":
          description: Updated role list for user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListDataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/{id}/status:
    patch:
      summary: Activate or deactivate user
      operationId: updateUserStatus
      x-ear-id: API-217
      tags: [Users]
      security:
        - bearerAuth: []
      description: |
        Soft activate/deactivate via `isActive`. Does not hard-delete the user.
        Requires permission `users:update` and Head Office Admin role
        (`ADMIN`, `ADMINISTRATOR`, or `SUPER_ADMIN`).
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusUpdateRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/{id}/reset-password:
    post:
      summary: Admin reset user password
      operationId: adminResetPassword
      x-ear-id: API-413
      tags: [Users]
      security:
        - bearerAuth: []
      description: |
        Generates a cryptographically secure temporary password, sets
        `forcePasswordChange=true`, revokes refresh tokens, and returns the
        temporary password once to the caller. Requires permission
        `users:reset_password` (Admin / Supervisor). Emits `password.admin_reset`.
        Temporary password must not be written to application logs.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Temporary password issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResetPasswordDataResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token (15 min). Claims: sub (user UUID), permissions[] (string),
        roles[] (string). Issued by POST /api/v1/auth/login or /auth/refresh.
        Refresh token is HttpOnly cookie only — never sent as Bearer.
  parameters:
    ComplaintId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportBranchId:
      name: branchId
      in: query
      required: false
      schema: { type: string, format: uuid }
    ReportDateFrom:
      name: dateFrom
      in: query
      required: false
      description: Inclusive lower bound on complaint `reportedAt` (ISO-8601)
      schema: { type: string, format: date-time }
    ReportDateTo:
      name: dateTo
      in: query
      required: false
      description: Inclusive upper bound on complaint `reportedAt` (ISO-8601)
      schema: { type: string, format: date-time }
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Missing permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidState:
      description: Action not allowed for current status
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Unique constraint or resource conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    AggregateComplaintStatus:
      type: string
      enum: [REGISTERED, IN_PROGRESS, CLOSED]
      description: |
        CM Aggregate complaint lifecycle (DEC-025 §3.3). API-210 and API-211
        emit only these values. Foundation `ComplaintStatus` (NEW, ASSIGNED,
        PENDING, ESCALATED, RESOLVED) is not used on the report wire.
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    ComplaintStatus:
      type: string
      enum:
        [
          NEW,
          ASSIGNED,
          IN_PROGRESS,
          PENDING,
          ESCALATED,
          RESOLVED,
          CLOSED,
        ]
      description: |
        Single source of truth for complaint lifecycle status.
        Initial status on create is NEW. PENDING added for TASK-009.
        ESCALATED remains for escalation path (separate from status transition matrix).
    TimelineEvent:
      type: string
      enum:
        [
          complaint.created,
          complaint.updated,
          complaint.assigned,
          complaint.reassigned,
          complaint.escalated,
          complaint.escalation_requested,
          complaint.escalation_approved,
          complaint.escalation_rejected,
          complaint.appointment_booked,
          complaint.appointment_checked_in,
          complaint.appointment_completed,
          complaint.appointment_no_show,
          complaint.final_resolution_submitted,
          complaint.resolved,
          complaint.closed,
          escalation.closed,
          sla.assignment.completed,
          sla.assignment.breached,
          sla.appointment.completed,
          sla.appointment.breached,
          sla.resolution.completed,
          sla.resolution.breached,
          sla.escalation.completed,
          sla.escalation.breached,
          sla.overall.completed,
          sla.overall.breached,
        ]
      description: |
        Allowed complaint timeline event names. SLA `sla.*.completed` /
        `sla.*.breached` events are emitted only on status change
        (TASK-025 / DEC-014); actor is SYSTEM.
    Error:
      type: object
      required: [code, message, details]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          nullable: true
          additionalProperties: true
    PageMeta:
      type: object
      required: [page, pageSize, totalItems]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
    ComplaintCreateRequest:
      type: object
      description: |
        Create complaint. Legacy payload (`customerId` + optional `branchId`)
        remains supported and implies sourceType=CUSTOMER, targetType=BRANCH
        (TASK-042 / DEC-018). Generalized payload requires sourceType, sourceId,
        targetType, and targetId together.

        Supported routes (TASK-043 Routing Foundation):
        CUSTOMER→BRANCH, BRANCH→HEAD_OFFICE, HEAD_OFFICE→BRANCH,
        SYSTEM→HEAD_OFFICE. Other combinations return 400 VALIDATION_ERROR.
      required: [subject, description, priority]
      properties:
        customerId: { type: string, format: uuid, nullable: true }
        branchId: { type: string, format: uuid, nullable: true }
        sourceType:
          $ref: "#/components/schemas/ComplaintSourceType"
        sourceId: { type: string, format: uuid }
        targetType:
          $ref: "#/components/schemas/ComplaintTargetType"
        targetId: { type: string, format: uuid, nullable: true }
        subject: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        priority: { $ref: "#/components/schemas/Priority" }
        channel: { type: string, maxLength: 32, nullable: true }
        category: { type: string, maxLength: 64, nullable: true }
        reportedAt: { type: string, format: date-time, nullable: true }
    ComplaintUpdateRequest:
      type: object
      properties:
        subject: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        priority: { $ref: "#/components/schemas/Priority" }
        channel: { type: string, maxLength: 32, nullable: true }
        category: { type: string, maxLength: 64, nullable: true }
        branchId: { type: string, format: uuid, nullable: true }
      description: At least one field must be provided. Status is not updatable here.
    ComplaintStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ComplaintStatus" }
        reason:
          type: string
          maxLength: 2000
          nullable: true
          description: Optional note recorded in timeline metadata
    Complaint:
      type: object
      required:
        - id
        - complaintNumber
        - sourceType
        - sourceId
        - targetType
        - subject
        - description
        - status
        - priority
        - reportedAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        complaintNumber: { type: string }
        customerId: { type: string, format: uuid, nullable: true }
        branchId: { type: string, format: uuid, nullable: true }
        sourceType: { $ref: "#/components/schemas/ComplaintSourceType" }
        sourceId: { type: string, format: uuid }
        targetType: { $ref: "#/components/schemas/ComplaintTargetType" }
        targetId: { type: string, format: uuid, nullable: true }
        subject: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/ComplaintStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        channel: { type: string, nullable: true }
        category: { type: string, nullable: true }
        reportedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        closedBy: { type: string, format: uuid, nullable: true }
        closureNotes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid, nullable: true }
        updatedAt: { type: string, format: date-time }
    ComplaintSourceType:
      type: string
      description: |
        Complaint originator (TASK-042 / DEC-018). Stored as VARCHAR so future
        values (e.g. VENDOR) can be added without schema changes.
      enum: [CUSTOMER, BRANCH, HEAD_OFFICE, SYSTEM]
    ComplaintTargetType:
      type: string
      description: |
        Complaint destination (TASK-042 / DEC-018). Stored as VARCHAR so future
        values (e.g. REGIONAL) can be added without schema changes.
      enum: [BRANCH, HEAD_OFFICE]
    ComplaintDataResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Complaint" }
    ComplaintListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Complaint" }
        meta: { $ref: "#/components/schemas/PageMeta" }
    SearchPagination:
      type: object
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
        - hasNext
        - hasPrevious
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        hasNext: { type: boolean }
        hasPrevious: { type: boolean }
      description: CAPABILITY-012 search pagination (DB-side).
    SearchSort:
      type: object
      required: [field, order]
      properties:
        field:
          type: string
          enum: [createdAt, updatedAt, priority, status, slaDueDate]
        order:
          type: string
          enum: [asc, desc]
    ComplaintSearchResponse:
      type: object
      required: [items, pagination, filtersApplied, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Complaint" }
        pagination: { $ref: "#/components/schemas/SearchPagination" }
        filtersApplied:
          type: object
          additionalProperties: true
          description: Echo of non-empty filters applied to the query
        sort: { $ref: "#/components/schemas/SearchSort" }
      description: CAPABILITY-012 Complaint search envelope (API-388).
    AssignComplaintRequest:
      type: object
      required: [assigneeId]
      properties:
        assigneeId: { type: string, format: uuid }
        reason:
          type: string
          maxLength: 2000
          nullable: true
          description: Mandatory when reassigning an already-assigned complaint
        notes: { type: string, maxLength: 2000, nullable: true }
    Assignment:
      type: object
      required:
        - id
        - complaintId
        - assigneeId
        - assignedAt
        - isCurrent
      properties:
        id: { type: string, format: uuid }
        complaintId: { type: string, format: uuid }
        assigneeId: { type: string, format: uuid }
        assigneeName:
          type: string
          nullable: true
          description: Display name of assignee (UI must not show assigneeId UUID)
        assignedBy: { type: string, format: uuid, nullable: true }
        assignedAt: { type: string, format: date-time }
        unassignedAt: { type: string, format: date-time, nullable: true }
        isCurrent: { type: boolean }
        notes: { type: string, nullable: true }
        reason: { type: string, nullable: true }
    AssignComplaintResult:
      type: object
      required: [assignment, complaintId, status, reassigned]
      properties:
        assignment: { $ref: "#/components/schemas/Assignment" }
        complaintId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ComplaintStatus" }
        reassigned: { type: boolean }
    AssignComplaintDataResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/AssignComplaintResult" }
    AssignmentListDataResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Assignment" }
    EscalateComplaintRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
        escalatedToUserId: { type: string, format: uuid, nullable: true }
        escalatedToRoleId: { type: string, format: uuid, nullable: true }
        escalatedFromUserId: { type: string, format: uuid, nullable: true }
      description: At least one of escalatedToUserId or escalatedToRoleId is required.
    EscalationReasonCode:
      type: string
      enum:
        [
          SPECIALIST_REQUIRED,
          COMPLEX_CASE,
          POLICY_EXCEPTION,
          CUSTOMER_REQUEST,
          OTHER,
        ]
      description: Minimum reason codes for Branch → HO Escalation Request (TASK-011).
    EscalationRequestCreate:
      type: object
      required: [reasonCode, reasonDescription, diagnosis]
      properties:
        reasonCode: { $ref: "#/components/schemas/EscalationReasonCode" }
        reasonDescription: { type: string, minLength: 1, maxLength: 2000 }
        diagnosis: { type: string, minLength: 1, maxLength: 5000 }
        notes: { type: string, maxLength: 5000, nullable: true }
    Escalation:
      type: object
      required:
        - id
        - complaintId
        - reason
        - level
        - status
        - escalatedAt
      properties:
        id: { type: string, format: uuid }
        complaintId: { type: string, format: uuid }
        escalatedFromUserId: { type: string, format: uuid, nullable: true }
        escalatedToUserId: { type: string, format: uuid, nullable: true }
        escalatedToRoleId: { type: string, format: uuid, nullable: true }
        reason: { type: string }
        level: { type: integer }
        status: { type: string }
        escalatedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        reasonCode: { type: string, nullable: true }
        reasonDescription: { type: string, nullable: true }
        diagnosis: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        requestedBy: { type: string, format: uuid, nullable: true }
        requestedByName:
          type: string
          nullable: true
          description: Display name of requester
        requestedAt: { type: string, format: date-time, nullable: true }
        reviewedBy: { type: string, format: uuid, nullable: true }
        reviewedByName:
          type: string
          nullable: true
          description: Display name of reviewer (HO Scheduler / Admin)
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewNotes: { type: string, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        closedBy: { type: string, format: uuid, nullable: true }
        closureNotes: { type: string, nullable: true }
        activeAppointment:
          allOf:
            - $ref: "#/components/schemas/AppointmentSummary"
          nullable: true
          description: Current BOOKED, CHECKED_IN, COMPLETED, or NO_SHOW appointment
    CloseEscalationRequest:
      type: object
      required: [notes]
      properties:
        notes: { type: string, minLength: 1, maxLength: 5000 }
    CloseEscalationResult:
      type: object
      required: [escalationId, status, closedAt, closedBy]
      properties:
        escalationId: { type: string, format: uuid }
        status: { type: string, enum: [CLOSED] }
        closedAt: { type: string, format: date-time }
        closedBy: { type: string, format: uuid }
    CloseEscalationDataResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/CloseEscalationResult" }
    SlaStatus:
      type: string
      enum: [PENDING, ON_TIME, BREACHED, COMPLETED]
      description: |
        SLA dimension status. TASK-024 evaluates PENDING / COMPLETED / BREACHED
        from immutable due_at snapshots. ON_TIME is reserved / unused.
    SlaRecord:
      type: object
      required:
        - id
        - complaintId
        - assignmentDueAt
        - resolutionDueAt
        - appointmentDueAt
        - escalationDueAt
        - overallDueAt
        - assignmentStatus
        - resolutionStatus
        - appointmentStatus
        - escalationStatus
        - overallStatus
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        complaintId: { type: string, format: uuid }
        assignmentDueAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Immutable snapshot — never rewritten by status evaluation.
        resolutionDueAt:
          type: string
          format: date-time
          nullable: true
        appointmentDueAt:
          type: string
          format: date-time
          nullable: true
        escalationDueAt:
          type: string
          format: date-time
          nullable: true
        overallDueAt:
          type: string
          format: date-time
          nullable: true
        assignmentStatus: { $ref: "#/components/schemas/SlaStatus" }
        resolutionStatus: { $ref: "#/components/schemas/SlaStatus" }
        appointmentStatus: { $ref: "#/components/schemas/SlaStatus" }
        escalationStatus: { $ref: "#/components/schemas/SlaStatus" }
        overallStatus: { $ref: "#/components/schemas/SlaStatus" }
        createdAt: { type: string, format: date-time }
