        actor: { type: string }
        caseNumber:
          type: string
          nullable: true
          description: Case number when the event is scoped to one Case
      description: Latest timeline event (max 10 on dashboard summary).
    DashboardAggregateKpis:
      type: object
      required:
        - total
        - open
        - closed
        - escalatePending
        - waitingAssignment
        - escalateApproved
        - escalateScheduled
        - hqAcceptedOpen
        - returnedToBranch
        - inProgress
      properties:
        total: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0, description: status=REGISTERED }
        closed: { type: integer, minimum: 0, description: status=CLOSED }
        escalatePending:
          type: integer
          minimum: 0
          description: >
            REGISTERED and intakeDisposition=ESCALATE_PENDING_APPROVAL
            (exclusive of IN_PROGRESS / CLOSED)
        waitingAssignment:
          type: integer
          minimum: 0
          description: >
            REGISTERED and not held in ESCALATION_ACTIVE
            (pending approval, approved, or HQ_SCHEDULED)
        escalateApproved:
          type: integer
          minimum: 0
          description: >
            REGISTERED and intakeDisposition=ESCALATE_APPROVED
            (exclusive of IN_PROGRESS / CLOSED)
        escalateScheduled:
          type: integer
          minimum: 0
          description: >
            Not CLOSED and intakeDisposition=HQ_SCHEDULED — still on the
            escalation path (usually IN_PROGRESS with a bound Case)
        hqAcceptedOpen:
          type: integer
          minimum: 0
          description: >
            Open and already accepted by Pusat (hq_accepted_at set or
            intakeDisposition=HQ_SCHEDULED). Cabang dashboard excludes
            these from its work book; Pusat keeps them. DEC-025
            open+closed=total is unchanged on this wire.
        returnedToBranch:
          type: integer
          minimum: 0
          description: >
            Open and intakeDisposition=RETURNED_TO_BRANCH. Cabang queue
            health uses this as its own work row. Not a donut slice —
            those rows stay in waitingAssignment / inProgress so the
            partition still sums to total.
        inProgress:
          type: integer
          minimum: 0
          description: >
            status=IN_PROGRESS and intakeDisposition is not HQ_SCHEDULED
      description: |
        DEC-020 Aggregate complaint KPI counts for dashboard cards.
        Branch scope = Aggregate owningUnitId matched to Branch.code
        (aligned with CM Batch-1 list visibility; not creator membership).
        Donut slices must use waitingAssignment / escalatePending /
        escalateApproved / escalateScheduled / inProgress / closed —
        not a single "NEW" bucket.
