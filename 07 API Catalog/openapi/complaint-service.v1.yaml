  /api/v1/complaints/{id}/sla:
    get:
      summary: Get complaint SLA
      operationId: getComplaintSla
      x-ear-id: API-314
      tags: [SLA]
      security:
        - bearerAuth: []
      description: |
        Returns the SLA record for a complaint (API-314 / TASK-024).
        One SLA row per complaint. Deadlines are immutable snapshots computed
        once at complaint create. Statuses are evaluated from stored `*DueAt`
        values and business completion facts (`PENDING` / `COMPLETED` /
        `BREACHED`) — policy is never re-read and deadlines are never
        rewritten. Evaluation runs on lifecycle events and on this read
        (idempotent; no scheduler). No create/update endpoints — SLA rows are
        created internally on complaint create.
        Requires permission `complaints:read`. 404 when complaint or SLA
        row is missing.
