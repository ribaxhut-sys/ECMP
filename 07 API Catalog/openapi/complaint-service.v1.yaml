    Customer:
      type: object
      required: [id, externalCustomerId, fullName]
      properties:
        id: { type: string, format: uuid }
        externalCustomerId: { type: string }
        fullName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
    CustomerListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
        meta: { $ref: "#/components/schemas/PageMeta" }
    CustomerDataResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Customer" }
    Branch:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    BranchListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Branch" }
        meta: { $ref: "#/components/schemas/PageMeta" }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 320
          description: Username or email
        password:
          type: string
          minLength: 1
          maxLength: 72
          format: password
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds
    TokenDataResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/TokenResponse" }
    AuthMe:
      type: object
      required:
        - id
        - username
        - email
        - fullName
        - roleId
        - isActive
        - createdAt
        - updatedAt
        - roles
        - permissions
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        fullName: { type: string }
        roleId: { type: string, format: uuid }
        branchId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean }
        forcePasswordChange: { type: boolean, default: false }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        preferredLanguage:
          type: string
          enum: [id, en]
          default: id
          description: Drives localized email/API messages for this user.
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
      description: Password hash is never included.
    AuthMeDataResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/AuthMe" }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
    ForgotPasswordResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: If the account exists, a reset link has been sent.
    ForgotPasswordDataResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ForgotPasswordResponse" }
    ResetPasswordRequest:
      type: object
      required: [token, password, confirmPassword]
      properties:
        token: { type: string, minLength: 1 }
        password: { type: string, minLength: 8, maxLength: 72 }
        confirmPassword: { type: string, minLength: 1, maxLength: 72 }
    ResetPasswordResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    ResetPasswordDataResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ResetPasswordResponse" }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 72 }
        newPassword: { type: string, minLength: 8, maxLength: 72 }
        confirmPassword: { type: string, minLength: 1, maxLength: 72 }
    ChangePasswordResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    ChangePasswordDataResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ChangePasswordResponse" }
    AdminResetPasswordResponse:
      type: object
      required: [userId, temporaryPassword, forcePasswordChange, message]
      properties:
        userId: { type: string, format: uuid }
        temporaryPassword: { type: string }
        forcePasswordChange: { type: boolean }
        message: { type: string }
    AdminResetPasswordDataResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/AdminResetPasswordResponse" }
    PreferredLanguageUpdateRequest:
      type: object
      required: [preferredLanguage]
      properties:
        preferredLanguage: { type: string, enum: [id, en] }
    PreferredLanguageUpdateResponse:
      type: object
      required: [preferredLanguage]
      properties:
        preferredLanguage: { type: string, enum: [id, en] }
    PreferredLanguageUpdateDataResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PreferredLanguageUpdateResponse" }
