  /api/v1/reports/by-branch:
    get:
      summary: Complaint and case counts by branch
      operationId: getReportByBranch
      x-ear-id: API-212
      tags: [Reports]
      security:
        - bearerAuth: []
      description: |
        SQL `COUNT` + `GROUP BY` owning unit. Sorted by branch-resolution
        percent (caseClosed/caseTotal) descending, then complaint volume.
        All callers with `reports:read` see every unit; optional `branchId`
        still filters one unit.
        Each row includes complaint totals and CM case metrics so Kesehatan
        Cabang can show total cases, resolved-at-branch, and open escalations.
        `caseClosed` = CLOSED cases not escalated to Pusat (plus no-Case
        complaints CLOSED off the HQ/escalation-active path). `escalated` =
        open complaints still on ESCALATION_ACTIVE dispositions.
        Soft-deleted complaints are excluded. Requires permission `reports:read`.
      parameters:
        - $ref: "#/components/parameters/ReportBranchId"
        - $ref: "#/components/parameters/ReportDateFrom"
        - $ref: "#/components/parameters/ReportDateTo"
      responses:
        "200":
          description: Branch breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchCountListDataResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/reports/cycle-time:
    get:
      summary: Cycle time of closed cases
      operationId: getReportCycleTime
      x-ear-id: API-545
      tags: [Reports]
      security:
        - bearerAuth: []
      description: |
        How long closed CM cases took, measured from case `createdAt` to
        `closedAt` and reported in days (average, median, p90, fastest,
        slowest) plus an age-band distribution.
        The `dateFrom`/`dateTo` window filters on **closure** date, not
        creation: a case opened in June and closed in August belongs to
        August. Complaints carry no `closedAt`, so cycle time is measured on
        Cases — the unit that records closure time.
        An empty window returns `closedCases: 0` with zeroed buckets, not 404.
        Requires permission `reports:read`.
      parameters:
        - $ref: "#/components/parameters/ReportBranchId"
        - $ref: "#/components/parameters/ReportDateFrom"
        - $ref: "#/components/parameters/ReportDateTo"
      responses:
        "200":
          description: Cycle time summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleTimeDataResponse"
              example:
                data:
                  closedCases: 10
                  averageDays: 4.1
                  medianDays: 4.0
                  p90Days: 7.4
                  fastestDays: 0.5
                  slowestDays: 9.0
                  buckets:
                    - { key: sameDay, count: 2 }
                    - { key: upTo3Days, count: 3 }
                    - { key: upTo7Days, count: 4 }
                    - { key: over7Days, count: 1 }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
