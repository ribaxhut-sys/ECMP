                  description: Owning aggregate type
                  example: Complaint
                aggregateId:
                  type: string
                  format: uuid
                  description: Owning aggregate id
                file:
                  type: string
                  format: binary
                  description: File bytes
      responses:
        "201":
          description: Attachment metadata created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentDataResponse"
              example:
                data:
                  id: "8f14e45f-ceea-467f-9b6e-5d8c2a1b0c9d"
                  aggregateType: Complaint
                  aggregateId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                  fileName: a1b2c3d4e5f6789012345678abcdef90.pdf
                  originalName: evidence.pdf
                  mimeType: application/pdf
                  extension: ".pdf"
                  sizeBytes: 2048
                  checksumSha256: "2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae"
                  storageProvider: local
                  uploadedBy: "11111111-1111-1111-1111-111111111111"
                  uploadedAt: "2026-07-25T12:00:00Z"
                  status: AVAILABLE
