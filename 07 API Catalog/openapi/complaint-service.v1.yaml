        branchId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean }
        forcePasswordChange: { type: boolean, default: false }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        initials:
          type: string
          minLength: 3
          maxLength: 3
          description: >
            Unique 3-letter avatar code assigned at registration. Inactive and
            soft-deleted users keep the code so it cannot be reused.
        preferredLanguage:
          type: string
          enum: [id, en]
          default: id
          description: Drives localized email/API messages for this user.
      description: |
        Password hash is never included in responses. `roleCode`/`roleName` are
        included for UI reference pickers (TASK-007 assignee select) so clients
        never need to display `roleId` UUIDs.
    UserDataResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/User" }
    UserListResponse:
      type: object
      required: [data, meta]
