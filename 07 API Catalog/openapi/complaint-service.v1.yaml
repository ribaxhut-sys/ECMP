              example:
                data:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  complaintId: 3fa85f64-5717-4562-b3fc-2c963f66afa7
                  assignmentDueAt: "2026-07-23T06:00:00Z"
                  appointmentDueAt: "2026-07-24T05:00:00Z"
                  resolutionDueAt: "2026-07-25T05:00:00Z"
                  escalationDueAt: "2026-07-23T13:00:00Z"
                  overallDueAt: "2026-07-26T05:00:00Z"
                  assignmentStatus: COMPLETED
                  appointmentStatus: PENDING
                  resolutionStatus: PENDING
                  escalationStatus: PENDING
                  overallStatus: PENDING
                  createdAt: "2026-07-23T05:00:00Z"
                  updatedAt: "2026-07-23T05:30:00Z"
        "401":
