openapi: 3.0.3
info:
  title: ECMP HQ Arrival Schedule API
  version: 1.0.0-lab
  description: |
    Advisory HQ arrival slot availability + holiday calendar for the Complaint
    Management Batch 1 escalation flow. Pusat remains the sole source of truth
    for `hqArrivalDate` / `hqArrivalTime` (set via
    `/api/v1/cm/complaints/{complaintId}/hq-accept-and-schedule` and
    `/hq-schedule-arrival`, and `/hq-complete`, catalogued in
    complaint-management-batch1.v1.yaml). Completing a visit (`HQ_CLOSED`)
    keeps the row visible that day (`scheduledCases[].completed=true`);
    occupancy (`scheduledCount` / `availableCount`) counts live
    `HQ_SCHEDULED` arrivals only. Detail responses also expose per-destination
    `units[]` (CRO / Sekretariat / Suban) driven by
    `hq.schedule.capacity_by_unit` (missing keys inherit `capacityPerSlot`).
    This module only answers "what does the
    grid look like" — a read-mostly
    capacity/proposal view plus a minimal holiday calendar CRUD for Pusat.
    Branch-proposed slots (`proposedArrivalDate` / `proposedArrivalTime` on
    ComplaintBatch1Response) are advisory only and never reduce
    `availableCount`; only Pusat-scheduled arrivals reduce slot capacity.
    Arrivals without `destinationUnitCode` stay listed but consume no unit's
    quota. Logical IDs API-CM-HQ-001…005 map to catalog IDs API-540…544.
    Not a Mode B unlock — `require_hq_intake_action` is a Mode A lab gate
    (backend/app/core/authorization/gates.py), not SSO/OIDC.
  x-ecmp-frd: FRD-CM-001
  x-ecmp-related-dec:
    - DEC-020
  x-ecmp-status: Implemented (lab) — Mode A only
  x-ecmp-ownership: HQ Schedule read model (`backend/app/modules/hq_schedule/`)
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: HqSchedule-Availability
    description: Branch-facing and Pusat-detail HQ arrival slot availability grid
  - name: HqSchedule-Holidays
    description: Pusat holiday calendar (minimal — no national calendar import/sync)
paths:
  /api/v1/hq-schedule/availability:
    get:
      summary: Branch-facing aggregate HQ arrival slot availability
      operationId: hqScheduleGetAvailability
      x-ear-id: API-540
      x-ecmp-logical-id: API-CM-HQ-001
      tags: [HqSchedule-Availability]
      security:
        - bearerAuth: []
      description: |
        Used inline in the branch escalation slot picker. No per-complaint
        detail — only slot-level counts. Requires `complaints:read`, not an
        HQ/Pusat role.
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AvailabilityResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/hq-schedule/availability/detail:
    get:
      summary: Pusat detail HQ arrival slot availability (with pending proposals)
      operationId: hqScheduleGetAvailabilityDetail
      x-ear-id: API-541
      x-ecmp-logical-id: API-CM-HQ-002
      tags: [HqSchedule-Availability]
      security:
        - bearerAuth: []
      description: |
        Same grid as `/availability`, plus per-slot `pendingProposals` (branch
        proposals awaiting Pusat accept/schedule/return). Gated by
        `require_hq_intake_action` — the existing Mode A lab HQ-intake gate
        (mirrors `principal_may_perform_hq_intake_action`), not a new
        permission and not SSO/OIDC.
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AvailabilityResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/hq-schedule/holidays:
    get:
      summary: List HQ schedule holidays in range
      operationId: hqScheduleListHolidays
      x-ear-id: API-542
      x-ecmp-logical-id: API-CM-HQ-003
      tags: [HqSchedule-Holidays]
      security:
        - bearerAuth: []
      description: Requires `settings:read`. Range defaults/limits match `/availability`.
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HolidayResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create or relabel an HQ schedule holiday
      operationId: hqScheduleCreateHoliday
      x-ear-id: API-543
      x-ecmp-logical-id: API-CM-HQ-004
      tags: [HqSchedule-Holidays]
      security:
        - bearerAuth: []
      description: |
        Requires `settings:update`. Upsert by `holidayDate` — if a holiday
        already exists on that date, its `label` (and `createdBy`) is
        overwritten in place; response is always `200`, never `201`.
        Minimal calendar management only — no national calendar import or
        government holiday sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HolidayCreateRequest"
      responses:
        "200":
          description: OK — created or relabelled (upsert)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HolidayResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/hq-schedule/holidays/{holidayDate}:
    delete:
      summary: Remove an HQ schedule holiday
      operationId: hqScheduleDeleteHoliday
      x-ear-id: API-544
      x-ecmp-logical-id: API-CM-HQ-005
      tags: [HqSchedule-Holidays]
      security:
        - bearerAuth: []
      description: Requires `settings:update`.
      parameters:
        - $ref: "#/components/parameters/HolidayDate"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DateFrom:
      name: from
      in: query
      required: false
      description: Range start (inclusive). Defaults to today.
      schema:
        type: string
        format: date
    DateTo:
      name: to
      in: query
      required: false
      description: |
        Range end (inclusive). Defaults to `from` + 6 days. Range
        (`to` - `from`) must not exceed 62 days.
      schema:
        type: string
        format: date
    HolidayDate:
      name: holidayDate
      in: path
      required: true
      schema:
        type: string
        format: date
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
              details:
                type: object
                additionalProperties: true
  schemas:
    CaseRef:
      type: object
      description: A Case tracking the escalation — id lets the schedule board link straight to the Case.
      required: [caseId, caseNumber]
      properties:
        caseId:
          type: string
        caseNumber:
          type: string
    ProposalSummary:
      type: object
      description: One scheduled or branch-proposed slot occupant (Pusat detail; branch aggregate only sees own unit).
      required: [complaintId, complaintNumber, unitCode]
      properties:
        complaintId:
          type: string
        complaintNumber:
          type: string
        owningUnitId:
          type: string
          nullable: true
        unitCode:
          type: string
        cases:
          type: array
          items:
            $ref: "#/components/schemas/CaseRef"
          description: Case(s) tracking this complaint's escalation — empty for pending proposals.
        proposedBy:
          type: string
          nullable: true
        proposedAt:
          type: string
          format: date-time
          nullable: true
        completed:
          type: boolean
          default: false
          description: >
            HQ visit completed (HQ_CLOSED). Still listed on that day's slot;
            still counted in scheduledCount / the occupancy ratio.
        destinationUnitCode:
          type: string
          nullable: true
          description: >
            Pusat unit the taxpayer reports to (CRO / Sekretariat / Suban).
            Empty on pending proposals and on visits scheduled before the
            destination column existed — those visits occupy no unit's quota.
        customerDisplayName:
          type: string
          nullable: true
          description: >
            Taxpayer display name from Master Customer (read-only; ECMP is
            not Customer SoR). Pusat detail (`/availability/detail`) returns
            names for every occupant. Branch aggregate (`/availability`)
            returns the name only for the caller's own unit — other units
            stay case-number-only because names are PII.
    SlotUnitAvailability:
      type: object
      description: Per-destination occupancy inside one slot.
      required: [unitCode, capacity, scheduledCount, availableCount]
      properties:
        unitCode:
          type: string
        unitName:
          type: string
        capacity:
          type: integer
        scheduledCount:
          type: integer
        completedCount:
          type: integer
          default: 0
        availableCount:
          type: integer
        bookable:
          type: boolean
          default: false
    SlotAvailability:
      type: object
      required:
        - startTime
        - endTime
        - capacity
        - scheduledCount
        - proposedCount
        - availableCount
      properties:
        startTime:
          type: string
          description: HH:MM (24h)
        endTime:
          type: string
          description: HH:MM (24h)
        capacity:
          type: integer
          description: >
            Capacity of THIS slot. Equals capacityPerSlot for a full-length slot;
            a slot shortened by a break (partial=true) carries a pro-rated,
            rounded-down capacity (minimum 1).
        partial:
          type: boolean
          default: false
          description: >
            Slot shortened because a break window does not land on a grid
            boundary — e.g. Jumat break 11:30–13:30 leaves 11:00–11:30 and
            13:30–14:00 bookable at half capacity.
        scheduledCount:
          type: integer
          description: >
            Live Pusat-scheduled arrivals (HQ_SCHEDULED) in this slot —
            reduces availableCount. Completed visits are excluded.
        proposedCount:
          type: integer
          description: Branch-proposed (awaiting decision) arrivals in this slot — advisory only.
        availableCount:
          type: integer
          description: capacity - scheduledCount (floored at 0). Never reduced by proposals or completed visits.
        pendingProposals:
          type: array
          description: Pusat detail only — always empty on the branch-facing aggregate view.
          items:
            $ref: "#/components/schemas/ProposalSummary"
        scheduledCases:
          type: array
          description: >
            Visits in this slot including completed (HQ_CLOSED) rows.
            Branch aggregate only includes the caller's own unit.
          items:
            $ref: "#/components/schemas/ProposalSummary"
        isBreak:
          type: boolean
          default: false
        completedCount:
          type: integer
          default: 0
        bookable:
          type: boolean
          default: false
        bookableCount:
          type: integer
          default: 0
        units:
          type: array
          description: >
            Occupancy per Pusat destination unit. Pusat detail only — always
            empty on the branch-facing aggregate view. Slot-level
            capacity / availableCount are the sums; arrivals with no
            destination unit yet are counted in scheduledCount but in no
            unit's quota.
          items:
            $ref: "#/components/schemas/SlotUnitAvailability"
    DayAvailability:
      type: object
      required: [date, weekday, closed]
      properties:
        date:
          type: string
          format: date
        weekday:
          type: integer
          description: ISO weekday, 1=Mon..7=Sun
        closed:
          type: boolean
        closedReason:
          type: string
          nullable: true
          enum: [WEEKEND, HOLIDAY]
        holidayLabel:
          type: string
          nullable: true
        slots:
          type: array
          description: Empty when closed=true.
          items:
            $ref: "#/components/schemas/SlotAvailability"
    AvailabilityResponse:
      type: object
      required: [startTime, endTime, slotMinutes, capacityPerSlot, days]
      properties:
        startTime:
          type: string
          description: HH:MM (24h) — from hq.schedule.start setting
        endTime:
          type: string
          description: HH:MM (24h) — from hq.schedule.end setting
        slotMinutes:
          type: integer
        capacityPerSlot:
          type: integer
          description: >
            Default per-unit capacity of a full-length slot
            (hq.schedule.capacity_per_slot). Detail view sums unit capacities
            into slots[].capacity; override individual units via
            hq.schedule.capacity_by_unit.
        days:
          type: array
          items:
            $ref: "#/components/schemas/DayAvailability"
    HolidayCreateRequest:
      type: object
      required: [holidayDate, label]
      properties:
        holidayDate:
          type: string
          format: date
        label:
          type: string
          minLength: 1
          maxLength: 200
    HolidayResponse:
      type: object
      required: [holidayDate, label, createdAt]
      properties:
        holidayDate:
          type: string
          format: date
        label:
          type: string
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
