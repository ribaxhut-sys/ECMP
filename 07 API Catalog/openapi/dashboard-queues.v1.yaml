openapi: 3.0.3
info:
  title: ECMP Dashboard Queues API
  version: 1.0.0
  description: |
    **NORMATIVE** — CAP-007 / FR-040 / FRD-006 🔒 LOCKED.

    API-040 GET /v1/dashboard/queues — operational Sprint ECMF case queue dashboard
    for Supervisors (unit-scoped), role & org scoped (BR-006), read-only (BR-DASH-03),
    Case SoT DOM-ECMF-003 (DEC-CAP007-BQ-001 §1). Permission: `dashboard:read`
    (DEC-CAP007-BQ-001 §2 / DEC-016 / SEC-RAM-001 Planned Sprint-03).

    Out of scope: CAP-008 Aggregate, API-513, API-390, Visit Queue API-360…381 (B2-09).
    Manager/Executive cross-unit aggregates deferred (DEC-CAP007-BQ-001 §4).
    Drill-down via existing API-002 / API-005 only (DEC-CAP007-BQ-001 §3).

    **2026-08-01 (B2-13):** Promoted from `drafts/dashboard-queues.v1.draft.yaml`
    without endpoint/schema/response invent — contract governance only.
    Evidence: `deploy/evidence/B2-13_API-040_Normative_Closure_20260801.md`.

    Versioning per ADR-006: URL prefix /v1. Error envelope {code, message, details?}.
    Timestamps ISO-8601 UTC; payload fields camelCase.
  x-frd: FRD-006
  x-fr: FR-040
  x-cap: CAP-007
  x-decision: DEC-CAP007-BQ-001
  x-architecture: B2-09
x-status: normative
servers:
  - url: http://localhost:8000/v1
    description: Local development
  - url: https://api.example.local/ecmp/v1
    description: Example deployed base
tags:
  - name: Dashboard
    description: Operational queue dashboard (read-only)
paths:
  /dashboard/queues:
    get:
      summary: Operational queue dashboard
      operationId: getDashboardQueues
      x-ear-id: API-040
      x-fr: FR-040
      x-decision: DEC-CAP007-BQ-001
      tags: [Dashboard]
      description: |
        Aggregated Sprint ECMF case queues for Supervisors (FR-040, BP-006,
        DEC-CAP007-BQ-001):
        - Supervisor of unit U sees only unit U queues (v0.1 actor scope).
          Manager/Executive cross-unit aggregates deferred (DEC-CAP007-BQ-001 §4).
        - Role & org scoped (BR-006 / BR-DASH-01/04).
        - Strictly read-only (BR-DASH-03): no mutation from dashboard endpoints.
        - Aggregates reconcile with source; non-real-time flagged via `asOf`
          (BR-DASH-02).
        - Requires permission `dashboard:read` (DEC-CAP007-BQ-001 §2; DEC-016;
          SEC-RAM-001 Planned Sprint-03 for API-040).
        - Case status enum = DOM-ECMF-003 (not CAP-008 Aggregate).
      responses:
        "200":
          description: Queue aggregates within the caller's role/org scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardQueuesResponse"
              examples:
                supervisorUnitView:
                  value:
                    asOf: "2026-07-21T09:30:00Z"
                    queues:
                      - unitId: "UNIT-01"
                        status: REGISTERED
                        count: 5
                        oldestCreatedAt: "2026-07-20T02:10:00Z"
                      - unitId: "UNIT-01"
                        status: IN_PROGRESS
                        count: 12
                        oldestCreatedAt: "2026-07-18T11:45:00Z"
        "401":
          description: Missing or invalid token (code=UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but missing dashboard:read (code=FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Target: JWT signed by IdP (ADR-007 target phase).
        Slice phase (DEV/CI only): static env token; claims {userId, permissions[]}.
        Required permission for API-040: `dashboard:read` (DEC-CAP007-BQ-001).
        401 = authentication failure; 403 = missing permission.
  schemas:
    CaseStatus:
      type: string
      enum: [REGISTERED, ASSIGNED, IN_PROGRESS, PENDING_REVIEW, CLOSED, REOPENED]
      description: Full baseline status set per DOM-ECMF-003 (DEC-CAP007-BQ-001 §1)
    QueueEntry:
      type: object
      required: [unitId, status, count]
      properties:
        unitId:
          type: string
        status:
          $ref: "#/components/schemas/CaseStatus"
        count:
          type: integer
          minimum: 0
        oldestCreatedAt:
          type: string
          format: date-time
          nullable: true
          description: createdAt of the oldest case in the bucket (UTC); null when count = 0
    DashboardQueuesResponse:
      type: object
      required: [asOf, queues]
      properties:
        asOf:
          type: string
          format: date-time
          description: Data freshness timestamp, UTC (BR-DASH-02 — lag must be visible)
        queues:
          type: array
          items:
            $ref: "#/components/schemas/QueueEntry"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
security:
  - bearerAuth: []
