<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layanan Kami</title>
  <meta name="description" content="Portal sementara — pilih layanan Pengaduan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1c17;
      --bg-mid: #163028;
      --ink: #f2f6f3;
      --muted: #a8b9b0;
      --accent: #3d9b6e;
      --accent-ink: #062016;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #1e4d3a 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, #1a3a48 0%, transparent 50%),
        linear-gradient(160deg, var(--bg), var(--bg-mid));
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
    }
    main {
      width: min(36rem, 100%);
      text-align: left;
    }
    .brand {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin: 0 0 1rem;
    }
    .lead {
      margin: 0 0 2rem;
      font-size: 1.125rem;
      line-height: 1.5;
      color: var(--muted);
      max-width: 28rem;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 1.35rem;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
      font-size: 1.05rem;
      text-decoration: none;
      border-radius: 0.35rem;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .cta:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .cta:focus-visible {
      outline: 2px solid #b6f0d0;
      outline-offset: 3px;
    }
    .note {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.45;
      max-width: 28rem;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">Layanan Kami</h1>
    <p class="lead">Pilih layanan untuk melanjutkan. Modul Pengaduan berjalan di subdomain khusus.</p>
    <a class="cta" href="https://pengaduan.layanankami.tech/login">Masuk ke Pengaduan</a>
    <p class="note">Portal sementara di VPS lab (Mode A). Login Enterprise / SSO belum diaktifkan.</p>
  </main>
</body>
</html>
