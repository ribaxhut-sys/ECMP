name: EAR Docs Governance

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ear-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt
          pip install PyYAML

      - name: Run Engineering OS generators
        run: python tools/eos.py --all

      - name: Build MkDocs site
        run: python -m mkdocs build --strict

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecmp-ear-site
          path: site

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecmp-eos-metrics
          path: |
            metrics/
            ai/rag/index.json
            00 Repository Guide/REPO_METRICS.generated.md
            00 Repository Guide/REPO_TRENDS.generated.md
            00 Repository Guide/FEEDBACK_METRICS.generated.md
            00 Repository Guide/DOC_COVERAGE.generated.md
            00 Repository Guide/REPO_HEALTH_REPORT.md

  # Prompt/policy changes must pass the AI evaluation gate (workspace rule).
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect prompt/policy changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ai:
              - 'ai-platform/prompts/**'
              - 'ai-platform/policies/**'

      - name: Setup Python
        if: steps.filter.outputs.ai == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.filter.outputs.ai == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Run AI evaluation gate (strict)
        if: steps.filter.outputs.ai == 'true'
        run: python tools/eval_benchmark.py --strict
