name: Backend CI

# EPIC-001 M1 — production backend only (DEC-019).
# Does not lint/test tools/, implementation/portal/, or implementation/backend/.

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "07 API Catalog/openapi/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "07 API Catalog/openapi/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecmp
          POSTGRES_PASSWORD: ecmp_ci
          POSTGRES_DB: ecmp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecmp -d ecmp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ecmp:ecmp_ci@localhost:5432/ecmp_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Align with backend/Dockerfile (python:3.13-slim) — DEC-019.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Show Ruff config source
        run: |
          python -c "import pathlib; p=pathlib.Path('pyproject.toml'); assert p.is_file(), 'missing backend/pyproject.toml'; print(p.resolve())"
          ruff check --show-settings app 2>&1 | head -n 40
      - name: Lint backend (ruff)
        # M2: config is authoritative under backend/pyproject.toml.
        # Existing lint debt (~90 findings) is non-blocking until burn-down;
        # hard gate is follow-up (not M0–M2). Tests/OpenAPI/Alembic remain blocking.
        continue-on-error: true
        run: ruff check app tests
      - name: Validate OpenAPI contracts (all specs incl. drafts)
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from openapi_spec_validator import validate
          specs = sorted(Path("07 API Catalog/openapi").rglob("*.yaml"))
          assert specs, "no OpenAPI specs found"
          for spec in specs:
              validate(yaml.safe_load(spec.read_text(encoding="utf-8")))
              print(f"OK {spec}")
          PY
      - name: Run migrations (Alembic)
        run: alembic upgrade head
      - name: Run tests against PostgreSQL (coverage gate)
        # Coverage burn-down: after CAPABILITY dump (~86.8%), restore fail-under=90
        # once repository integration tests close the gap (EPIC-001 follow-up).
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=86

  security-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Audit runtime dependencies (pip-audit)
        run: pip-audit -r requirements.txt
