name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, "docs/**", "feature/**", "release/**"]
    paths:
      - "implementation/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "implementation/frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pin LTS — Node 22+ optional Rollup natives have caused CI/sandbox hangs.
          node-version: "20"
          cache: npm
          cache-dependency-path: implementation/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests with coverage gate
        # Sprint-10 RC1: Vitest coverage thresholds (baseline lines/statements ≥12%).
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Bundle size budget (warning)
        # P1 warning mode — fails the step on overrun but does not block the job.
        continue-on-error: true
        run: npm run check:bundle-budget
      - name: Accessibility checks (warning)
        # P1 warning mode — axe-core smoke; non-blocking for RC1.
        continue-on-error: true
        run: npm run test:a11y
