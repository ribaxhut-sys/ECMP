name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - "implementation/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "implementation/frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pin LTS — Node 22+ optional Rollup natives have caused CI/sandbox hangs.
          node-version: "20"
          cache: npm
          cache-dependency-path: implementation/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
