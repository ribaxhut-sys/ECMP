# ECMP foundation stack — production-capable Compose (R6-03).
# Secrets: never commit .env. Validate with:
#   python scripts/validate-production-config.py --env-file .env
# Redis is intentionally absent (login lockout is in-memory).
# Attachment blobs persist on named volume ``ecmp_attachments`` (default path
# ``storage/attachments`` under the backend working directory).
#
# Startup order: postgres (healthy) → backend (migrate + healthy) → frontend.
# Prefer IMAGE_TAG=vX.Y.Z (or RC tag) instead of floating "latest" for production.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecmp}
      # R2-02: no weak password fallback — require .env (see .env.example for local).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-ecmp}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ecmp_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecmp} -d ${POSTGRES_DB:-ecmp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: ecmp-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      # R2-02: no weak "admin" fallback — require .env when tools profile is used.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env (see .env.example)}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ecmp_pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # R6-01: set via scripts/release/build-rc.ps1 (or export before compose build).
        APP_VERSION: ${APP_VERSION:-1.0.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_TREE_STATE: ${GIT_TREE_STATE:-unknown}
    image: ecmp-backend:${IMAGE_TAG:-latest}
    container_name: ecmp-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ecmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-ecmp}
      # Development default only — production startup rejects localhost / non-HTTPS origins.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (see .env.example)}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-300}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-15}
      PASSWORD_RESET_FRONTEND_BASE_URL: ${PASSWORD_RESET_FRONTEND_BASE_URL:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-logging}
      # CM Batch 1 Master Customer — TASK-OPS-03 stance: stub for lab/synthetic only.
      # Do not set enterprise until an approved Enterprise HTTP adapter lands (EX-A/EX-B).
      CUSTOMER_PROVIDER: ${CUSTOMER_PROVIDER:-stub}
      CUSTOMER_PROVIDER_ENTERPRISE_BASE_URL: ${CUSTOMER_PROVIDER_ENTERPRISE_BASE_URL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Persist LocalStorageProvider blobs across recreate (default root storage/attachments).
      - ecmp_attachments:/app/storage/attachments
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # R2-04: no silent localhost default — must be set in .env for local or prod.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env (see .env.example)}
        # R6-01 provenance
        APP_VERSION: ${APP_VERSION:-1.0.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_TREE_STATE: ${GIT_TREE_STATE:-unknown}
    image: ecmp-frontend:${IMAGE_TAG:-latest}
    container_name: ecmp-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ecmp_pgdata:
  ecmp_pgadmin:
  ecmp_attachments:
