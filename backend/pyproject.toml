# EPIC-001 / DEC-019 — Backend tooling (production tree: backend/)
# Python target matches production Docker image (python:3.13-slim).

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
  "N815", # camelCase fields are intentional: API contract uses camelCase
  "B008", # Depends(...) in defaults is the canonical FastAPI DI idiom
]

[tool.ruff.lint.per-file-ignores]
# Scoped burn-down debt. The CI lint gate is BLOCKING (backend-ci.yml); these
# narrow exemptions exist so the gate can be enforced everywhere else while the
# remaining findings are cleared. Delete each entry as its debt is paid — do not
# widen the scope, and do not add new paths without a recorded decision.
#
# E501 — long `suggested_fix=` strings in the startup-validation inventory.
#        File is under active revision (ADR-014 Mode A/B switches); reflowing it
#        now would collide with in-flight work.
"app/core/config.py" = ["E501"]
# B017 — 35 blind `pytest.raises(Exception)` assertions across 22 test modules.
#        Each needs its concrete exception type (e.g. FrozenInstanceError,
#        ValidationError) plus a verifying test run; not a mechanical fix.
# E501 — a handful of long literals in fixtures.
"tests/**" = ["B017", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "security: Foundation security verification suite (SECMIG-P5-006)",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  # Structural stub only — CAPABILITY-013 has no dashboard persistence.
  "app/modules/dashboard/repository.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
